spring.application.name=auth-service

# Load local secrets from .env (optional, never commit .env)
spring.config.import=optional:file:.env[.properties]

# ===============================
# Server
# ===============================
server.port=8081
server.servlet.context-path=/api/v1

# ===============================
# Database (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#jpa.properties.hibernate.cache.use_second_level_cache=false
#jpa.properties.hibernate.cache.use_query_cache=false
#jpa.properties.hibernate.cache.region.factory_class=org.redisson.hibernate.cache.RedissonRegionFactory
#jpa.properties.hibernate.generate_statistics=false
#jpa.properties.hibernate.cache.redisson.config=classpath:redisson.yaml

# ===============================
# Redis Configuration
# ===============================
#spring.redis.host=localhost
#spring.redis.port=6379



# ===============================
# JWT Configuration
# ===============================
security.jwt.secret=MySuperSecretKeyForJwtTokenGeneration123456
security.jwt.expiration-ms=600000
security.jwt.refresh-expiration-ms=604800000
security.jwt.issuer=auth-service
# access token: 10 minutes | refresh token: 7 days

# ===============================
# Spring Security
# ===============================
spring.security.username.name=disabled
spring.security.username.password=disabled

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.arth.auth=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.com.arth=DEBUG